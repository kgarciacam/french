const state=JSON.parse(localStorage.getItem("kathyFrenchV2")||'{}');
state.day=state.day||1; state.done=state.done||{};
function save(){localStorage.setItem("kathyFrenchV2",JSON.stringify(state));}
function count(){document.getElementById("count").textContent=`Día ${state.day} de 30 · ${30-state.day} días hasta completar el programa`;}
function makeNav(){let n=document.getElementById("nav");["Hoy","Las 30 frases","Repaso","Progreso"].forEach((x,i)=>{let b=document.createElement("button");b.textContent=x;b.onclick=()=>show(i,b);if(i===0)b.classList.add("active");n.appendChild(b)})}
function show(tab,btn){document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));btn.classList.add("active");let m=document.getElementById("main"), d=DAYS[state.day-1];
if(tab===0){
m.innerHTML=`<div class="card"><div class="row"><span class="tag">Día ${state.day}</span><span class="streak">🎯 30 frases</span></div><h2>${d.title}</h2><p class="muted">${d.desc}</p><div class="progress"><div class="bar" style="width:${(state.day-1)/29*100}%"></div></div></div>
<div class="card"><h3>🔥 Misión de hoy</h3><p><b>1.</b> Lee las 30 frases en voz alta.<br><b>2.</b> Repite cada una 3 veces.<br><b>3.</b> Tapa la traducción e intenta recordarlas.<br><b>4.</b> Elige 5 y úsalas en una mini conversación.</p><button onclick="completeDay()">✓ Marcar día como completado</button></div>
<div id="phrases"></div>`; renderPhrases(d.phrases)}
else if(tab===1){m.innerHTML=`<div class="card"><h2>📚 ${d.title}</h2><p class="muted">Tu objetivo no es memorizar listas: es conseguir que estas frases salgan automáticamente.</p><input class="search" id="search" placeholder="Buscar frase..." oninput="filterPhrases()"> </div><div id="phrases"></div>`;renderPhrases(d.phrases)}
else if(tab===2){let keys=Object.keys(state.review||{});m.innerHTML=`<div class="card"><h2>🧠 Repaso</h2><p class="muted">Aquí aparecerán las frases que marques como difíciles.</p>${keys.length?keys.map(k=>`<div class="phraseCard"><b>${k}</b><div class="translation">${state.review[k]}</div></div>`).join(""):"<p>Todavía no tienes frases marcadas. Empieza por las de hoy.</p>"}</div>`}
else{let completed=Object.keys(state.done).filter(k=>state.done[k]).length;m.innerHTML=`<div class="card"><h2>📈 Tu progreso</h2><div class="big">${completed} / 30</div><p class="muted">días completados</p><div class="progress"><div class="bar" style="width:${completed/30*100}%"></div></div></div><div class="card"><h3>🏁 Meta</h3><p>Al terminar tendrás 900 frases trabajadas, organizadas por situaciones reales de viaje y conversación.</p></div><div class="card"><h3>🇫🇷 Después de los 30 días</h3><p>La siguiente versión puede añadir listening, ejercicios de respuesta rápida, conjugación, conversaciones ramificadas y un examen oral.</p></div>`}
count()}
function renderPhrases(ps){let box=document.getElementById("phrases");box.innerHTML=ps.map((p,i)=>`<div class="phraseCard"><div class="num">PHRASE ${i+1} / 30</div><div class="phrase">${p[0]}</div><div class="translation">${p[1]}</div><div class="grid"><button onclick="speak(${JSON.stringify(p[0])})">🔊 Escuchar</button><button onclick="hard(${JSON.stringify(p[0])},${JSON.stringify(p[1])})">⭐ Difícil</button></div></div>`).join("")}
function filterPhrases(){let q=document.getElementById("search").value.toLowerCase();document.querySelectorAll(".phraseCard").forEach(x=>x.style.display=x.innerText.toLowerCase().includes(q)?"block":"none")}
function speak(t){if("speechSynthesis" in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";u.rate=.85;speechSynthesis.speak(u)}}
function hard(a,b){state.review=state.review||{};state.review[a]=b;save();alert("⭐ Añadida al repaso")}
function completeDay(){state.done[state.day]=true;if(state.day<30)state.day++;save();count();alert("🎉 Día completado. Mañana seguimos.");show(0,document.querySelector("nav button"))}
makeNav();count();show(0,document.querySelector("nav button"));
