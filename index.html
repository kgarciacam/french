const KEY = "kathyFrenchV3";
const todayKey = new Date().toISOString().slice(0,10);
let state = JSON.parse(localStorage.getItem(KEY) || "{}");
state.day = state.day || 1;
state.phrases = state.phrases || {};
state.review = state.review || [];
state.recordings = state.recordings || {};
state.lastStudy = state.lastStudy || null;
state.streak = state.streak || 0;

function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }
function getP(id){
  return state.phrases[id] || {status:"new", reps:0, last:null, next:null, ease:2.5};
}
function setP(id, patch){
  const old=getP(id); state.phrases[id]=Object.assign({},old,patch); save();
}
function idFor(day,i){ return `d${day}p${i}`; }

function localDate(s){
  const d=new Date(s); return new Date(d.getFullYear(),d.getMonth(),d.getDate());
}
function daysBetween(a,b){
  return Math.round((localDate(b)-localDate(a))/86400000);
}

function schedule(id, quality){
  // quality: 0=again, 1=hard, 2=good, 3=easy
  const p=getP(id);
  let interval;
  if(quality===0) interval=0;
  else if(quality===1) interval=p.reps<1 ? 1 : Math.max(1, Math.round((p.next?Math.max(1,daysBetween(p.last,todayKey)):1)*1.5));
  else if(quality===2) interval=p.reps<1 ? 1 : p.reps===1 ? 3 : p.reps===2 ? 7 : Math.round(Math.max(7,(p.next?daysBetween(p.last,p.next):7))*2);
  else interval=p.reps<1 ? 2 : p.reps===1 ? 5 : p.reps===2 ? 14 : Math.round(Math.max(14,(p.next?daysBetween(p.last,p.next):14))*2.3);
  const next=new Date(); next.setDate(next.getDate()+interval);
  let status = quality===0 ? "new" : (quality===3 && p.reps>=3 ? "automatic" : "learned");
  setP(id,{status,reps:p.reps+1,last:todayKey,next:next.toISOString().slice(0,10),ease:Math.max(1.3,Math.min(3.2,p.ease+(quality===3?.15:quality===0?-.2:0)))});
}

function isDue(id){
  const p=getP(id);
  return p.status!=="automatic" && p.next && p.next<=todayKey;
}

function countCompletedDay(day){
  return DAYS[day-1].phrases.filter((_,i)=>getP(idFor(day,i)).reps>0).length;
}
function dayComplete(day){ return countCompletedDay(day)>=30; }

function markStudy(){
  if(state.lastStudy!==todayKey){
    const yesterday=new Date(); yesterday.setDate(yesterday.getDate()-1);
    const y=yesterday.toISOString().slice(0,10);
    state.streak = state.lastStudy===y ? state.streak+1 : 1;
    state.lastStudy=todayKey; save();
  }
}

let speechTimer=null;
let speechKeepAlive=null;
let speechToken=0;

function speak(text, rate=0.88){
  if(!("speechSynthesis" in window)){
    alert("Tu navegador no tiene síntesis de voz disponible. Prueba Chrome o Safari.");
    return;
  }

  const synth=window.speechSynthesis;
  const token=++speechToken;

  // iPhone/Safari puede ignorar un speak() justo después de cancel().
  // Cancelamos y dejamos que el motor de voz se reinicie antes de hablar.
  clearTimeout(speechTimer);
  clearInterval(speechKeepAlive);
  synth.cancel();

  const start=()=>{
    if(token!==speechToken) return;

    const u=new SpeechSynthesisUtterance(text);
    u.lang="fr-FR";
    u.rate=rate;
    u.pitch=1;

    let started=false;

    u.onstart=()=>{
      started=true;
      // Mantiene viva la síntesis en Safari/iOS para frases largas.
      clearInterval(speechKeepAlive);
      speechKeepAlive=setInterval(()=>{
        if(token===speechToken && synth.speaking){
          synth.pause();
          synth.resume();
        }
      }, 5000);
    };

    const cleanup=()=>{
      if(token===speechToken){
        clearInterval(speechKeepAlive);
        speechKeepAlive=null;
      }
    };

    u.onend=cleanup;
    u.onerror=cleanup;

    synth.speak(u);

    // Si Safari no inició la voz, reintenta una vez.
    setTimeout(()=>{
      if(token===speechToken && !started && !synth.speaking){
        synth.cancel();
        synth.speak(u);
      }
    }, 250);
  };

  speechTimer=setTimeout(start, 80);
}

let mediaRecorder=null, recChunks=[], recStream=null;
async function recordStart(id, button){
  if(!navigator.mediaDevices || !window.MediaRecorder){
    alert("La grabación no está disponible en este navegador. En iPhone funciona mejor desde Safari en HTTPS.");
    return;
  }
  try{
    recStream=await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRecorder=new MediaRecorder(recStream); recChunks=[];
    mediaRecorder.ondataavailable=e=>{ if(e.data.size) recChunks.push(e.data); };
    mediaRecorder.onstop=()=>{
      const blob=new Blob(recChunks,{type:"audio/webm"});
      state.recordings[id]=URL.createObjectURL(blob);
      const player=document.querySelector(`[data-player="${id}"]`);
      if(player){ player.src=state.recordings[id]; player.classList.remove("hidden"); }
      recStream.getTracks().forEach(t=>t.stop());
      button.textContent="🎙️ Grabar de nuevo";
      save();
    };
    mediaRecorder.start(); button.textContent="⏹️ Parar grabación";
  }catch(e){ alert("Necesitamos permiso para usar el micrófono."); }
}
function recordToggle(id,button){
  if(mediaRecorder && mediaRecorder.state==="recording"){ mediaRecorder.stop(); return; }
  recordStart(id,button);
}

function setStatus(id, status){
  const p=getP(id);
  if(status==="review"){
    if(!state.review.includes(id)) state.review.push(id);
    setP(id,{status:p.reps? "learned":"new"});
  } else if(status==="learned"){
    state.review=state.review.filter(x=>x!==id);
    schedule(id,2);
  } else if(status==="automatic"){
    state.review=state.review.filter(x=>x!==id);
    setP(id,{status:"automatic",reps:Math.max(3,p.reps),last:todayKey,next:null});
  }
  save(); render();
}

function nextDay(){
  markStudy();
  if(state.day<30) state.day++;
  save(); render();
}

function render(){
  document.getElementById("count").textContent=`Día ${state.day} de 30 · 🔥 ${state.streak} ${state.streak===1?"día":"días"} de racha`;
  const main=document.getElementById("main");
  const d=DAYS[state.day-1];
  const done=countCompletedDay(state.day);
  const due=Object.keys(state.phrases).filter(isDue).length;
  const mastered=Object.values(state.phrases).filter(p=>p.status==="automatic").length;
  main.innerHTML=`
  <div class="card heroCard">
    <div class="row"><span class="tag">Día ${state.day}</span><b>${done}/30</b></div>
    <h2>${d.title}</h2><p class="muted">${d.desc}</p>
    <div class="progress"><div class="bar" style="width:${done/30*100}%"></div></div>
  </div>
  <div class="card mission">
    <h3>🎯 Cómo estudiar hoy</h3>
    <p><b>1.</b> Mira español e intenta producir el francés.</p>
    <p><b>2.</b> Escucha y repite.</p>
    <p><b>3.</b> Grábate en las frases difíciles.</p>
    <p><b>4.</b> Marca <b>Lo aprendí</b> o <b>Repasar</b>.</p>
    ${due?`<button class="reviewBtn" onclick="showTab('review')">🔄 Tengo ${due} repasos pendientes</button>`:""}
  </div>
  <div id="phraseList"></div>
  <div class="card"><h3>🚀 ¿Quieres avanzar?</h3><p class="muted">Puedes hacer 60, 90 o más frases. Completar un día no te bloquea.</p>
  <button onclick="nextDay()">Pasar al Día ${Math.min(30,state.day+1)}</button></div>`;
  renderPhrases(d.phrases);
}

function renderPhrases(ps){
  const box=document.getElementById("phraseList");
  box.innerHTML=ps.map((p,i)=>{
    const id=idFor(state.day,i), s=getP(id);
    const label=s.status==="automatic"?"⚡ Automática":s.status==="learned"?"✓ Aprendida":"Nueva";
    const dueText=isDue(id)?"🔄 Repaso hoy":"";
    return `<div class="phraseCard ${s.status}">
      <div class="row"><span class="num">FRASE ${i+1}/30</span><span class="pill">${label}</span></div>
      <div class="phrase">${p.fr}</div>
      <div class="translation">${p.es}</div>
      <div class="actions">
        <button onclick='speak(${JSON.stringify(p.fr)},.88)'>🔊 Escuchar</button>
        <button onclick='speak(${JSON.stringify(p.fr)},.62)'>🐢 Lento</button>
        <button onclick='recordToggle(${JSON.stringify(id)},this)'>🎙️ Grabarme</button>
      </div>
      <audio class="player ${state.recordings[id]?'':'hidden'}" data-player="${id}" controls src="${state.recordings[id]||''}"></audio>
      <details><summary>🔀 Variación</summary><p><b>${p.variation[0]}</b><br><span class="muted">${p.variation[1]}</span></p></details>
      <div class="statusActions">
        <button class="learn" onclick='setStatus(${JSON.stringify(id)},"learned")'>✓ Lo aprendí</button>
        <button class="later" onclick='setStatus(${JSON.stringify(id)},"review")'>🔄 Repasar</button>
      </div>
      <div class="tiny">${dueText}</div>
    </div>`;
  }).join("");
}

function showTab(tab){
  document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
  const idx=["home","review","progress","france"].indexOf(tab);
  if(idx>=0) document.querySelectorAll("nav button")[idx].classList.add("active");
  const main=document.getElementById("main");
  if(tab==="home"){render();return;}
  if(tab==="review"){
    const due=state.review.map(id=>({id,p:getPhraseById(id)})).filter(x=>x.p);
    const auto=Object.keys(state.phrases).filter(isDue).map(id=>({id,p:getPhraseById(id)}));
    const all=[...new Map([...due,...auto].map(x=>[x.id,x])).values()];
    main.innerHTML=`<div class="card"><h2>🔄 Repaso espaciado</h2><p class="muted">Las frases vuelven cuando tu memoria las necesita. No tienes que decidir cuándo.</p></div>
    ${all.length?all.map(x=>reviewCard(x.id,x.p)).join(""):`<div class="card"><h3>✨ Nada pendiente</h3><p class="muted">Puedes seguir con las frases de hoy.</p></div>`}`;
    return;
  }
  if(tab==="progress"){
    const vals=Object.values(state.phrases), learned=vals.filter(p=>p.status==="learned").length, automatic=vals.filter(p=>p.status==="automatic").length, newc=vals.filter(p=>p.status==="new").length;
    main.innerHTML=`<div class="card"><h2>📈 Tu progreso</h2><div class="stats"><div><b>${state.day}/30</b><small>Día actual</small></div><div><b>${state.streak}</b><small>Racha</small></div><div><b>${learned}</b><small>Aprendidas</small></div><div><b>${automatic}</b><small>Automáticas</small></div></div></div>
    <div class="card"><h3>🧠 Mastery</h3><p>🆕 Nueva: ${newc} · ✓ Aprendida: ${learned} · ⚡ Automática: ${automatic}</p>
    <p class="muted">“Automática” significa que ya la has recuperado varias veces y vuelve menos seguido.</p></div>`;
    return;
  }
  if(tab==="france"){
    main.innerHTML=`<div class="card"><h2>🇫🇷 Modo Francia</h2><p class="muted">Acceso rápido a situaciones reales.</p><div class="grid">
    ${["☕ Café","🍽️ Restaurante","🏨 Hotel","✈️ Aeropuerto","🚆 Tren","🛍️ Compras","🗺️ Direcciones","💬 Conversación"].map(x=>`<button onclick="alert('En la próxima expansión: ${x.replace(/^[^ ]+ /,'')}')">${x}</button>`).join("")}</div></div>`;
  }
}
function getPhraseById(id){
  const m=id.match(/^d(\\d+)p(\\d+)$/); if(!m)return null;
  const d=DAYS[+m[1]-1], p=d?.phrases[+m[2]]; return p?Object.assign({day:+m[1],index:+m[2]},p):null;
}
function reviewCard(id,p){
  return `<div class="phraseCard"><div class="num">DÍA ${p.day} · FRASE ${p.index+1}</div>
  <div class="translation"><b>${p.es}</b></div><div class="actions">
  <button onclick='speak(${JSON.stringify(p.fr)},.88)'>🔊 Escuchar</button>
  <button onclick='showAnswer(this,${JSON.stringify(p.fr)})'>🧠 Ver francés</button></div>
  <div class="statusActions"><button class="again" onclick='schedule(${JSON.stringify(id)},0);render()'>😵 Otra vez</button><button onclick='schedule(${JSON.stringify(id)},1);render()'>🤔 Difícil</button><button onclick='schedule(${JSON.stringify(id)},2);render()'>😊 Bien</button><button onclick='schedule(${JSON.stringify(id)},3);render()'>⚡ Fácil</button></div></div>`;
}
function showAnswer(btn,text){btn.parentElement.insertAdjacentHTML("afterend",`<div class="phrase answer">${text}</div>`);btn.disabled=true;}

function setupNav(){
 const nav=document.getElementById("nav");
 [["home","Hoy"],["review","🔄 Repaso"],["progress","📈 Progreso"],["france","🇫🇷 Modo Francia"]].forEach((x,i)=>{
   const b=document.createElement("button"); b.textContent=x[1]; b.onclick=()=>showTab(x[0]); if(i===0)b.classList.add("active"); nav.appendChild(b);
 });
}
setupNav(); render();

</script>
</body></html>
